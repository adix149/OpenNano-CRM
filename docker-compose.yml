services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nanobliss
      POSTGRES_PASSWORD: nanobliss
      POSTGRES_DB: nanobliss
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanobliss -d nanobliss"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgres://nanobliss:nanobliss@db:5432/nanobliss
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
